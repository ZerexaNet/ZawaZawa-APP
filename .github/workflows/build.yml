name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build (electron mode)
        run: npm run build:web

      - name: Package Windows
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            # tag 构建：版本号跟随 tag（v1.0.0 → 1.0.0）
            VER="${GITHUB_REF_NAME#v}"
            npx electron-builder --win --x64 -c.version="$VER"
          else
            # 无 tag：版本号加构建号，便于区分各次 pre-release
            BASE="$(node -p "require('./package.json').version")"
            npx electron-builder --win --x64 -c.version="${BASE}-${GITHUB_RUN_NUMBER}"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp release/*.exe release/*.zip out/
          ls -lh out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ZawaZawa {0}', github.ref_name) || 'ZawaZawa pre-release (main 自动构建)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          draft: false
          fail_on_unmatched_files: false
          body: |
            ${{ startsWith(github.ref, 'refs/tags/') && '## 正式版本' || '## 预发布（main 每次推送自动覆盖）' }}

            - Commit: `${{ github.sha }}`
            - 触发: ${{ github.ref_name }}
            - 构建: [Actions #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            运行 portable exe 即可使用，无需安装。
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
